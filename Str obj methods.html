<!DOCTYPE html>
<html>
<head>
    <title>String Methods</title>
</head>
<body>

<script>
let str = "Hello World";

document.write("Original: " + str + "<br>");
document.write("Length: " + str.length + "<br>");
document.write("Uppercase: " + str.toUpperCase() + "<br>");
document.write("Lowercase: " + str.toLowerCase() + "<br>");
document.write("Substring: " + str.substring(0,5) + "<br>");
document.write("Replace: " + str.replace("World","JavaScript") + "<br>");
document.write("Index of 'World': " + str.indexOf("World") + "<br>");
</script>

</body>
</html>
