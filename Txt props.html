<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Properties</title>
    <style>
        body {
            font-family: Arial;
        }
        h1 {
            color: blue;
            text-align: center;
            text-transform: uppercase;
        }
        p {
            font-size: 18px;
            font-style: italic;
            letter-spacing: 2px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<h1>CSS Example</h1>
<p>This is a paragraph demonstrating font and text properties.</p>

</body>
</html>
