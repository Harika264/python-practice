<!DOCTYPE html>
<html>
<head>
    <title>JS Functions</title>
</head>
<body>

<script>
// Factorial
function factorial(n) {
    let fact = 1;
    for(let i=1; i<=n; i++) {
        fact *= i;
    }
    return fact;
}

// Fibonacci
function fibonacci(n) {
    let a=0, b=1, temp;
    document.write("Fibonacci: ");
    for(let i=0; i<n; i++) {
        document.write(a + " ");
        temp = a + b;
        a = b;
        b = temp;
    }
    document.write("<br>");
}

// Prime
function isPrime(n) {
    for(let i=2; i<n; i++) {
        if(n % i == 0) return false;
    }
    return n > 1;
}

// Palindrome
function isPalindrome(num) {
    let rev = 0, temp = num;
    while(num > 0) {
        let rem = num % 10;
        rev = rev * 10 + rem;
        num = Math.floor(num / 10);
    }
    return temp === rev;
}

// Output
let num = 5;
document.write("Factorial: " + factorial(num) + "<br>");
fibonacci(5);
document.write("Is Prime: " + isPrime(5) + "<br>");
document.write("Is Palindrome: " + isPalindrome(121));
</script>

</body>
</html>
